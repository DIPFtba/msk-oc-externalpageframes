<!DOCTYPE html>
<html>
	<head>
	<meta charset="utf-8" />
	<!-- <script src="https://cdn.jsdelivr.net/npm/@json-editor/json-editor@latest/dist/jsoneditor.min.js"></script> -->
	<script src="./jsoneditor-nightly.js"></script>

	<!-- Latest compiled and minified CSS -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
	<!-- jQuery library -->
	<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
	<!-- Popper JS -->
	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
	<!-- Latest compiled JavaScript -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css" integrity="sha512-5A8nwdMOWrSz20fDsjczgUidUBR8liPYU+WymTZP1lmY9G6Oc7HlZv156XqnsgNUzTyMefFTcsFH/tnJE/+xBg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
	<div id="all">
		<div id="left">

			<div id="EWK">
				<div id="ewk_container"></div>
				<div id="ewk_textcontainer">
					<div></div>
				</div>
			</div>
			<hr id="ruler">
			<div id="editor_container">
				<div id="JSON_EDITOR"></div>
				<div id="json_button">
					<button id="save">Save JSON</button>
					<button id="exportsvg">Export SVG</button>
					<button id="exportpng">Export PNG</button>
					<input type="file" id="json_upload" accept=".json">
					<button id="load">Load JSON</button>
				</div>
				<div id="schema_select"></div>
			</div>

		</div>
		<div id="vruler"></div>
		<div id="right">
			<div id="doku"><a target="_blank" href="doku.html">Doku</a></div>
			<div id="loaderOut"></div>
			<div id="debugVarsOut"></div>
			<hr id="ruler2">
			<div id="debugLogsOut">
				<span class="flex-container">
					<span id="logs" class="header enabled">Logs</span>
					<span id="events" class="header enabled">Events</span>
					<!-- <span id="messages" class="header enabled">Messages</span> -->
					<span id="clear">&#x274C;</span>
				</span>
			</div>
		</div>
	</div>

	<!-- Send message -->
	<dialog id="send-msg">
		<h3>Message an EWK senden</h3>
		<div class="select">Welche Message: <select name="msg"></select></div>
		<div class="descr" id="send-msg-descr"></div>
		<div class="input"><textarea id="send-msg-data"></textarea></div>
		<div class="button"><button id="send-msg-ok">Senden</button><button id="send-msg-cancel">Abbruch</button></div>
	</dialog>

	<!-- Das temporäre Overlay -->
	<dialog id="fullscreen-overlay"></dialog>
</body>
</html>
