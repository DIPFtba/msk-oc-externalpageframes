<html>
    <head>
        <style>
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
            button {
                position: absolute;
                top: 10px;
                left: 10px;
            }
            iframe {
                width: 100%;
                height: 100%;
                position: absolute;
                top: 0px;
                left: 0px;
            }
        </style>
    </head>
    <body>
        <iframe src="inputCheck.html"></iframe>
        <button onclick="document.querySelector('iframe').contentWindow.postMessage('Nachricht','*')">Focus Input</button>
    </body>
</html>
